<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selección de Retos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="levels-grid" aria-label="Selección de retos por nivel">
      <article class="level-card" data-level="1">
        <div class="background-polygons" aria-hidden="true"></div>
        <div class="branch branch-top" aria-hidden="true"></div>

        <header class="level-header">
          <span class="leaf leaf-left" aria-hidden="true"></span>
          <h2>Sección 1</h2>
          <span class="leaf leaf-right" aria-hidden="true"></span>
        </header>

        <div class="image-frame">
          <div class="placeholder">
            <div class="tree-icon" aria-hidden="true"></div>
            <p>Tu reto es...</p>
          </div>
          <img class="challenge-image" alt="Level 1 challenge" />
        </div>

        <button class="challenge-button" type="button">Escoge tu reto</button>
        <button class="reset-button" type="button">Reiniciar</button>
        <div class="branch branch-bottom" aria-hidden="true"></div>
        <span class="corner-decoration" aria-hidden="true"></span>
      </article>

      <article class="level-card" data-level="2">
        <div class="background-polygons" aria-hidden="true"></div>
        <div class="branch branch-top" aria-hidden="true"></div>

        <header class="level-header">
          <span class="leaf leaf-left" aria-hidden="true"></span>
          <h2>Sección 2</h2>
          <span class="leaf leaf-right" aria-hidden="true"></span>
        </header>

        <div class="image-frame">
          <div class="placeholder">
            <div class="tree-icon" aria-hidden="true"></div>
            <p>Tu reto es...</p>
          </div>
          <img class="challenge-image" alt="Level 2 challenge" />
        </div>

        <button class="challenge-button" type="button">Escoge tu reto</button>
        <button class="reset-button" type="button">Reiniciar</button>
        <div class="branch branch-bottom" aria-hidden="true"></div>
        <span class="corner-decoration" aria-hidden="true"></span>
      </article>

      <article class="level-card" data-level="3">
        <div class="background-polygons" aria-hidden="true"></div>
        <div class="branch branch-top" aria-hidden="true"></div>

        <header class="level-header">
          <span class="leaf leaf-left" aria-hidden="true"></span>
          <h2>Sección 3</h2>
          <span class="leaf leaf-right" aria-hidden="true"></span>
        </header>

        <div class="image-frame">
          <div class="placeholder">
            <div class="tree-icon" aria-hidden="true"></div>
            <p>Tu reto es...</p>
          </div>
          <img class="challenge-image" alt="Level 3 challenge" />
        </div>

        <button class="challenge-button" type="button">Escoge tu reto</button>
        <button class="reset-button" type="button">Reiniciar</button>
        <div class="branch branch-bottom" aria-hidden="true"></div>
        <span class="corner-decoration" aria-hidden="true"></span>
      </article>

      <article class="level-card" data-level="4">
        <div class="background-polygons" aria-hidden="true"></div>
        <div class="branch branch-top" aria-hidden="true"></div>

        <header class="level-header">
          <span class="leaf leaf-left" aria-hidden="true"></span>
          <h2>Reto</h2>
          <span class="leaf leaf-right" aria-hidden="true"></span>
        </header>

        <div class="image-frame">
          <div class="placeholder">
            <div class="tree-icon" aria-hidden="true"></div>
            <p>Tu reto es...</p>
          </div>
          <img class="challenge-image" alt="Level 4 challenge" />
        </div>

        <button class="challenge-button" type="button">Escoge tu reto</button>
        <button class="reset-button" type="button">Reiniciar</button>
        <div class="branch branch-bottom" aria-hidden="true"></div>
        <span class="corner-decoration" aria-hidden="true"></span>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
